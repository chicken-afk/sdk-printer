<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Printer Monitor - Real-time Status</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .content {
            padding: 30px;
        }

        .status-bar {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
        }

        .status-card {
            flex: 1;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            color: white;
            font-weight: 600;
        }

        .status-card.connected {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
        }

        .status-card.disconnected {
            background: linear-gradient(135deg, #eb3349 0%, #f45c43 100%);
        }

        .status-card .label {
            font-size: 12px;
            opacity: 0.9;
            margin-bottom: 5px;
        }

        .status-card .value {
            font-size: 20px;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        button {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-success {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
        }

        .btn-danger {
            background: linear-gradient(135deg, #eb3349 0%, #f45c43 100%);
            color: white;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        .printers-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }

        .printer-card {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            border: 2px solid #e9ecef;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .printer-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 5px;
            height: 100%;
            background: #28a745;
        }

        .printer-card.idle::before {
            background: #28a745;
        }

        .printer-card.printing::before {
            background: #007bff;
        }

        .printer-card.busy::before {
            background: #ffc107;
        }

        .printer-card.offline::before {
            background: #dc3545;
        }

        .printer-card.error::before {
            background: #dc3545;
        }

        .printer-card.paper_jam::before {
            background: #dc3545;
        }

        .printer-card.paper_out::before {
            background: #ff6b6b;
        }

        .printer-card.paper_problem::before {
            background: #ff6b6b;
        }

        .printer-card.paused::before {
            background: #ffc107;
        }

        .printer-card.waiting::before {
            background: #17a2b8;
        }

        .printer-card.processing::before {
            background: #17a2b8;
        }

        .printer-card.toner_low::before {
            background: #fd7e14;
        }

        .printer-card.no_toner::before {
            background: #dc3545;
        }

        .printer-card.door_open::before {
            background: #ff6b6b;
        }

        .printer-card.user_intervention::before {
            background: #ffc107;
        }

        .printer-card.unknown::before {
            background: #6c757d;
        }

        .printer-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        }

        .printer-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 15px;
        }

        .printer-name {
            font-size: 18px;
            font-weight: 700;
            color: #333;
            flex: 1;
        }

        .printer-status {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .printer-status.idle {
            background: #d4edda;
            color: #155724;
        }

        .printer-status.printing {
            background: #cfe2ff;
            color: #084298;
        }

        .printer-status.busy,
        .printer-status.processing {
            background: #fff3cd;
            color: #856404;
        }

        .printer-status.offline,
        .printer-status.error {
            background: #f8d7da;
            color: #721c24;
        }

        .printer-status.paper_jam,
        .printer-status.paper_out,
        .printer-status.paper_problem,
        .printer-status.door_open {
            background: #f8d7da;
            color: #721c24;
        }

        .printer-status.paused {
            background: #fff3cd;
            color: #856404;
        }

        .printer-status.waiting {
            background: #d1ecf1;
            color: #0c5460;
        }

        .printer-status.toner_low {
            background: #ffe5d0;
            color: #8b4000;
        }

        .printer-status.no_toner {
            background: #f8d7da;
            color: #721c24;
        }

        .printer-status.user_intervention {
            background: #fff3cd;
            color: #856404;
        }

        .printer-status.unknown {
            background: #e2e3e5;
            color: #383d41;
        }

        .printer-id {
            font-size: 11px;
            color: #6c757d;
            font-family: 'Courier New', monospace;
            margin-bottom: 12px;
        }

        .printer-papers {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #dee2e6;
        }

        .printer-papers-label {
            font-size: 12px;
            color: #6c757d;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .paper-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
        }

        .paper-tag {
            padding: 4px 10px;
            background: #667eea;
            color: white;
            border-radius: 5px;
            font-size: 11px;
            font-weight: 500;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat-box {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            border: 2px solid #e9ecef;
        }

        .stat-label {
            font-size: 12px;
            color: #6c757d;
            margin-bottom: 8px;
            text-transform: uppercase;
            font-weight: 600;
        }

        .stat-value {
            font-size: 32px;
            font-weight: bold;
            color: #667eea;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #6c757d;
        }

        .empty-state-icon {
            font-size: 64px;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #6c757d;
        }

        .loading-spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .last-update {
            text-align: center;
            font-size: 12px;
            color: #6c757d;
            margin-top: 20px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>🖨️ Printer Monitor</h1>
            <p>Real-time Printer Status Monitoring via WebSocket</p>
        </div>

        <div class="content">
            <!-- Status Bar -->
            <div class="status-bar">
                <div id="sdkStatus" class="status-card disconnected">
                    <div class="label">SDK Connection</div>
                    <div class="value">⚫ Disconnected</div>
                </div>
                <div id="monitorStatus" class="status-card disconnected">
                    <div class="label">Printer Monitor</div>
                    <div class="value">⚫ Inactive</div>
                </div>
            </div>

            <!-- Statistics -->
            <div class="stats">
                <div class="stat-box">
                    <div class="stat-label">Total Printers</div>
                    <div class="stat-value" id="totalPrinters">0</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Online Printers</div>
                    <div class="stat-value" id="onlinePrinters">0</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Updates Received</div>
                    <div class="stat-value" id="updateCount">0</div>
                </div>
            </div>

            <!-- Controls -->
            <div class="controls">
                <button class="btn-success" id="startBtn" onclick="startMonitoring()">
                    Start Monitoring
                </button>
                <button class="btn-danger" id="stopBtn" onclick="stopMonitoring()" disabled>
                    Stop Monitoring
                </button>
                <button class="btn-primary" id="refreshBtn" onclick="refreshStatus()" disabled>
                    🔄 Refresh Now
                </button>
            </div>

            <!-- Printers Grid -->
            <div id="printersContainer">
                <div class="loading">
                    <div class="loading-spinner"></div>
                    <p style="margin-top: 15px;">Waiting for connection...</p>
                </div>
            </div>

            <div class="last-update" id="lastUpdate">
                Last update: Never
            </div>
        </div>
    </div>

    <!-- Load SDK -->
    <script src="src/index.js"></script>
    <script>
        let sdk = null;
        let updateCount = 0;

        // Start monitoring
        function startMonitoring() {
            console.log("Initializing SDK...");
            sdk = new PrinterSDK('http://localhost:8971/api/v1');

            // SDK Connection callback
            sdk.onConnectionChange = (isConnected, maxRetriesReached) => {
                const statusEl = document.getElementById('sdkStatus');
                if (isConnected) {
                    statusEl.className = 'status-card connected';
                    statusEl.innerHTML = `
                        <div class="label">SDK Connection</div>
                        <div class="value">🟢 Connected</div>
                    `;

                    // Start printer monitoring when SDK connected
                    sdk.startPrinterMonitoring();
                } else {
                    statusEl.className = 'status-card disconnected';
                    statusEl.innerHTML = `
                        <div class="label">SDK Connection</div>
                        <div class="value">⚫ Disconnected</div>
                    `;

                    if (maxRetriesReached) {
                        alert('Cannot connect to SDK. Please check if it is running.');
                    }
                }
            };

            // Printer Monitor Connected callback
            sdk.onPrinterMonitorConnected = () => {
                const statusEl = document.getElementById('monitorStatus');
                statusEl.className = 'status-card connected';
                statusEl.innerHTML = `
                    <div class="label">Printer Monitor</div>
                    <div class="value">🟢 Active</div>
                `;

                document.getElementById('startBtn').disabled = true;
                document.getElementById('stopBtn').disabled = false;
                document.getElementById('refreshBtn').disabled = false;
            };

            // Printer Status Update callback
            sdk.onPrinterStatusUpdate = (data) => {
                updateCount++;
                console.log("Printer status update:", data);

                // Update stats
                document.getElementById('totalPrinters').textContent = data.total_count;
                document.getElementById('updateCount').textContent = updateCount;

                // Count printers by status (idle, printing, or any ready state = online)
                const readyStatuses = ['idle', 'waiting', 'printing', 'busy', 'processing'];
                const onlineCount = data.printers.filter(p => readyStatuses.includes(p.status)).length;
                document.getElementById('onlinePrinters').textContent = onlineCount;

                // Update last update time
                const now = new Date(data.timestamp);
                document.getElementById('lastUpdate').textContent =
                    `Last update: ${now.toLocaleTimeString()}`;

                // Render printers
                renderPrinters(data.printers);
            };
        }

        // Stop monitoring
        function stopMonitoring() {
            if (sdk) {
                sdk.stopPrinterMonitoring();
                sdk.stopHealthCheck();

                const sdkStatus = document.getElementById('sdkStatus');
                sdkStatus.className = 'status-card disconnected';
                sdkStatus.innerHTML = `
                    <div class="label">SDK Connection</div>
                    <div class="value">⚫ Disconnected</div>
                `;

                const monitorStatus = document.getElementById('monitorStatus');
                monitorStatus.className = 'status-card disconnected';
                monitorStatus.innerHTML = `
                    <div class="label">Printer Monitor</div>
                    <div class="value">⚫ Inactive</div>
                `;

                document.getElementById('startBtn').disabled = false;
                document.getElementById('stopBtn').disabled = true;
                document.getElementById('refreshBtn').disabled = true;

                // Clear printers display
                document.getElementById('printersContainer').innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">🖨️</div>
                        <h3>Monitoring Stopped</h3>
                        <p>Click "Start Monitoring" to begin tracking printer status</p>
                    </div>
                `;
            }
        }

        // Refresh status
        function refreshStatus() {
            if (sdk && sdk.refreshPrinterStatus()) {
                console.log("Manual refresh requested");
            }
        }

        // Render printers
        function renderPrinters(printers) {
            const container = document.getElementById('printersContainer');

            if (printers.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📭</div>
                        <h3>No Printers Found</h3>
                        <p>No printers are currently installed on this system</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = '<div class="printers-grid">' +
                printers.map(printer => `
                    <div class="printer-card ${printer.status}">
                        <div class="printer-header">
                            <div class="printer-name">
                                ${getStatusIcon(printer.status)} ${escapeHtml(printer.name)}
                            </div>
                            <div class="printer-status ${printer.status}">
                                ${formatStatus(printer.status)}
                            </div>
                        </div>
                        <div class="printer-id">ID: ${escapeHtml(printer.id)}</div>
                        <div class="printer-papers">
                            <div class="printer-papers-label">
                                📄 Supported Paper Sizes (${printer.paper_sizes.length})
                            </div>
                            <div class="paper-tags">
                                ${printer.paper_sizes.slice(0, 8).map(size =>
                    `<span class="paper-tag">${escapeHtml(size)}</span>`
                ).join('')}
                                ${printer.paper_sizes.length > 8 ?
                        `<span class="paper-tag">+${printer.paper_sizes.length - 8} more</span>` : ''}
                            </div>
                        </div>
                    </div>
                `).join('') +
                '</div>';
        }

        // Get status icon
        function getStatusIcon(status) {
            const icons = {
                'idle': '🟢',
                'printing': '🔵',
                'busy': '🟡',
                'processing': '🟡',
                'waiting': '🔵',
                'paused': '🟡',
                'offline': '🔴',
                'error': '🔴',
                'paper_jam': '🔴',
                'paper_out': '🔴',
                'paper_problem': '🔴',
                'door_open': '🔴',
                'no_toner': '🔴',
                'toner_low': '🟠',
                'user_intervention': '🟡',
                'unknown': '⚪'
            };
            return icons[status] || '⚪';
        }

        // Format status text
        function formatStatus(status) {
            const statusMap = {
                'idle': 'Ready',
                'printing': 'Printing',
                'busy': 'Busy',
                'processing': 'Processing',
                'waiting': 'Waiting',
                'paused': 'Paused',
                'offline': 'Offline',
                'error': 'Error',
                'paper_jam': 'Paper Jam',
                'paper_out': 'Paper Out',
                'paper_problem': 'Paper Problem',
                'door_open': 'Door Open',
                'no_toner': 'No Toner',
                'toner_low': 'Toner Low',
                'user_intervention': 'Needs Attention',
                'out_of_memory': 'Out of Memory',
                'output_bin_full': 'Output Full',
                'not_available': 'Not Available',
                'initializing': 'Initializing',
                'warming_up': 'Warming Up',
                'power_save': 'Power Save',
                'unknown': 'Unknown'
            };
            return statusMap[status] || status.replace(/_/g, ' ').toUpperCase();
        }

        // Escape HTML to prevent XSS
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Initialize on page load
        window.onload = () => {
            console.log("Printer Monitor ready. Click 'Start Monitoring' to begin.");
        };

        // Clean up on page unload
        window.onbeforeunload = () => {
            if (sdk) {
                sdk.stopPrinterMonitoring();
                sdk.stopHealthCheck();
            }
        };
    </script>
</body>

</html>
